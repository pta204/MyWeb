<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trợ lý Dinh dưỡng AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --background-color: #f0f4f8;
            --container-bg: #ffffff;
            --header-bg: #4CAF50;
            --user-msg-bg: #007bff;
            --bot-msg-bg: #eef1f5;
            --text-color: #333;
            --font-family: 'Be Vietnam Pro', sans-serif;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--background-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 10px;
        }

        #chat-app {
            width: 100%;
            max-width: 700px;
            height: 90vh;
            max-height: 800px;
            display: flex;
            flex-direction: column;
            background: var(--container-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        header {
            background-color: var(--header-bg);
            color: white;
            padding: 16px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        header h1 {
            margin: 0;
            font-size: 1.5em;
        }

        #chat-box {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .message {
            display: flex;
            align-items: flex-end;
            margin-bottom: 20px;
            max-width: 90%;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            flex-shrink: 0;
            margin-right: 12px;
        }
        
        .bot-message .avatar { background-color: #4CAF50; }
        .user-message .avatar { background-color: var(--user-msg-bg); }

        .message-content {
            background-color: var(--bot-msg-bg);
            padding: 12px 18px;
            border-radius: 18px;
            color: var(--text-color);
            line-height: 1.6;
        }
        
        .user-message {
            margin-left: auto;
            flex-direction: row-reverse;
        }
        .user-message .avatar { margin-right: 0; margin-left: 12px; }
        .user-message .message-content {
            background-color: var(--user-msg-bg);
            color: white;
        }

        /* Styling for Markdown content */
        .message-content h1, .message-content h2, .message-content h3 { margin-top: 0; }
        .message-content ul, .message-content ol { padding-left: 20px; }
        .message-content li { margin-bottom: 8px; }

        /* Typing indicator */
        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #999;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        #chat-input-area {
            padding: 20px;
            border-top: 1px solid #e0e0e0;
        }

        #message-form { display: flex; }
        #user-input {
            flex-grow: 1;
            border: 1px solid #ccc;
            padding: 12px 18px;
            border-radius: 24px;
            font-size: 1em;
            font-family: var(--font-family);
        }
        #user-input:focus { border-color: var(--header-bg); outline: none; }

        #send-btn {
            background: var(--header-bg);
            color: #fff;
            border: none;
            width: 48px;
            height: 48px;
            margin-left: 12px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5em;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s;
        }
        #send-btn:hover { background-color: #45a049; }
        #send-btn:disabled { background-color: #ccc; cursor: not-allowed; }

        .copy-btn {
            display: block;
            margin-top: 12px;
            padding: 6px 12px;
            border: 1px solid #ccc;
            background-color: #fff;
            color: #333;
            border-radius: 8px;
            cursor: pointer;
            font-family: var(--font-family);
            font-size: 0.9em;
        }
        .copy-btn:hover { background-color: #f0f0f0; }

    </style>
</head>
<body>
    <div id="chat-app">
        <header>
            <h1>Trợ lý Dinh dưỡng AI</h1>
        </header>

        <div id="chat-box">
            <div class="message bot-message">
                <div class="avatar">AI</div>
                <div class="message-content">
                    <p>Xin chào! Tôi là trợ lý dinh dưỡng.</p>
                    <p>Bạn muốn tạo thực đơn cho mục tiêu gì? (ví dụ: giảm cân, tăng cơ, ăn chay...)</p>
                </div>
            </div>
        </div>
        
        <div id="chat-input-area">
            <form id="message-form">
                <input type="text" id="user-input" placeholder="Nhập yêu cầu của bạn..." autocomplete="off">
                <button id="send-btn" type="submit" title="Gửi">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </form>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const messageForm = document.getElementById('message-form');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        // Gửi tin nhắn khi form được submit
        messageForm.addEventListener('submit', (e) => {
            e.preventDefault();
            sendMessage();
        });

        // Xử lý sự kiện click cho nút copy (sử dụng event delegation)
        chatBox.addEventListener('click', function(e) {
            if (e.target && e.target.classList.contains('copy-btn')) {
                const textToCopy = e.target.previousElementSibling.innerText;
                navigator.clipboard.writeText(textToCopy).then(() => {
                    e.target.textContent = 'Đã sao chép!';
                    setTimeout(() => {
                        e.target.textContent = 'Sao chép thực đơn';
                    }, 2000);
                });
            }
        });

        async function sendMessage() {
            const userMessageText = userInput.value.trim();
            if (userMessageText === '') return;

            appendMessage(userMessageText, 'user');
            userInput.value = '';
            userInput.focus();
            toggleInput(true); // Vô hiệu hóa input

            // Hiển thị chỉ báo đang gõ
            const typingIndicator = showTypingIndicator();
            
            try {
                // Gửi yêu cầu đến server Flask
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: userMessageText })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                // Xóa chỉ báo và hiển thị câu trả lời của bot
                typingIndicator.remove();
                appendMessage(data.response, 'bot');

            } catch (error) {
                typingIndicator.remove();
                appendMessage('Rất tiếc, đã có lỗi xảy ra. Vui lòng thử lại.', 'bot');
                console.error('Error:', error);
            } finally {
                toggleInput(false); // Kích hoạt lại input
            }
        }

        function appendMessage(text, type) {
            const isBot = type === 'bot';
            const messageWrapper = document.createElement('div');
            messageWrapper.className = `message ${isBot ? 'bot-message' : 'user-message'}`;

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = isBot ? 'AI' : 'Bạn';
            
            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';

            if (isBot) {
                // Chuyển đổi Markdown sang HTML
                const htmlContent = marked.parse(text);
                const contentHolder = document.createElement('div');
                contentHolder.innerHTML = htmlContent;
                
                // Thêm nút copy
                const copyButton = document.createElement('button');
                copyButton.className = 'copy-btn';
                copyButton.textContent = 'Sao chép thực đơn';

                messageContent.appendChild(contentHolder);
                messageContent.appendChild(copyButton);

            } else {
                messageContent.textContent = text;
            }

            messageWrapper.appendChild(avatar);
            messageWrapper.appendChild(messageContent);
            chatBox.appendChild(messageWrapper);
            scrollToBottom();
        }

        function showTypingIndicator() {
            const indicatorWrapper = document.createElement('div');
            indicatorWrapper.className = 'message bot-message';
            indicatorWrapper.innerHTML = `
                <div class="avatar">AI</div>
                <div class="message-content typing-indicator">
                    <span></span><span></span><span></span>
                </div>
            `;
            chatBox.appendChild(indicatorWrapper);
            scrollToBottom();
            return indicatorWrapper;
        }

        function toggleInput(disabled) {
            userInput.disabled = disabled;
            sendBtn.disabled = disabled;
        }

        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        
        userInput.focus();
    </script>
</body>
</html>
